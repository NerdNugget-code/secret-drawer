name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: secret-drawer-win-x64
          path: dist/*.exe
          if-no-files-found: error
